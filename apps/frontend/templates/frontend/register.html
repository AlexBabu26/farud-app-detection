{% extends "frontend/base.html" %}
{% load static %}
{% block title %}Register — Fraud App Detection{% endblock %}
{% block head_scripts %}
<script defer src="{% static 'frontend/js/pages/register.js' %}"></script>
{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 48px auto;">
  <div class="card">
    <div class="card-body">
      <h1 class="page-title" style="margin-bottom: 24px;">Register</h1>
      <form id="registerForm">
        <div style="margin-bottom: 16px;">
          <label>Username</label>
          <input class="input-modern" name="username" required autocomplete="username" />
        </div>
        <div style="margin-bottom: 16px;">
          <label>Email (optional)</label>
          <input class="input-modern" name="email" type="email" autocomplete="email" />
        </div>
        <div style="margin-bottom: 16px;">
          <label>Password</label>
          <input class="input-modern" name="password" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div style="margin-bottom: 20px;">
          <label>Confirm Password</label>
          <input class="input-modern" name="password2" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button class="btn-primary w-full" type="submit">Create Account</button>
      </form>
      <p class="text-small text-muted" style="margin-top: 24px;">
        Already registered? <a href="/login/" class="link-primary">Login</a>.
      </p>
    </div>
  </div>
</div>
{% endblock %}
